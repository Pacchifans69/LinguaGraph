[project]
name = "linguagraph-api"
version = "0.1.0"
description = "LinguaGraph backend API — FastAPI modular monolith"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14,<2.0",
    "fastapi>=0.115,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "sqlalchemy>=2.0.36,<2.1",
    "uvicorn[standard]>=0.34,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
addopts = "-ra"
markers = [
    "integration: requires a reachable PostgreSQL server (TEST_DATABASE_URL); runs against a disposable database only",
]
