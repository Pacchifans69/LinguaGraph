[alembic]
# Path to the migration environment (relative to this file).
script_location = alembic
# Make the apps/api directory importable so env.py can import the app package.
prepend_sys_path = .

# Default development database. env.py overrides this with the DATABASE_URL
# environment variable when set, so the app and Alembic share one source of truth.
sqlalchemy.url = postgresql+psycopg://linguagraph:linguagraph@localhost:5432/linguagraph

# Migration file naming: 0001_initial_foundation.py
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
