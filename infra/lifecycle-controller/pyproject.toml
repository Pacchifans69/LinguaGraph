[project]
name = "linguagraph-lifecycle-controller"
version = "0.1.0"
description = "LC-A4 Tier-A shadow lifecycle controller"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lifecycle_controller"]
